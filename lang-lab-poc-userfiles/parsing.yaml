parser:
  start: Program

  grammar:
    Program:
      - 'Decl*'

    Decl:
      - 'Function'
      - 'EnumDecl'

    Function:
      - '"fn" IDENT "(" ParamList? ")" "->" Type Block'

    ParamList:
      - 'Param ("," Param)*'

    Param:
      - 'IDENT ":" Type'

    Block:
      - '"{" Stmt* Expr "}"'

    Stmt:
      - 'LetStmt'

    LetStmt:
      - '"let" IDENT "=" Expr ";"'

    Expr:
      - 'IfExpr'
      - 'MatchExpr'
      - 'CallExpr'
      - 'LambdaExpr'
      - 'TupleExpr'
      - 'ProjExpr'
      - 'Literal'
      - 'IDENT'
      - 'Block'

    IfExpr:
      - '"if" Expr Block "else" Block'

    MatchExpr:
      - '"match" Expr "{" MatchArm+ "}"'

    MatchArm:
      - 'Pattern "=>" Expr ","'

    ProjExpr:
      - '"proj" "(" Expr "," INT ")"'

    TupleExpr:
      - '"(" Expr ("," Expr)+ ")"'

    CallExpr:
      - 'IDENT "(" ArgList? ")"'

    ArgList:
      - 'Expr ("," Expr)*'

    LambdaExpr:
      - '"|" IDENT "|" Expr'

    Type:
      - 'IDENT'

    EnumDecl:
      - '"enum" IDENT "{" IDENT ("," IDENT)* "}"'

    Pattern:
      - 'IDENT'

    Literal:
      - 'INT'
      - 'BOOL'
      - 'STRING'
      - 'UNIT'
