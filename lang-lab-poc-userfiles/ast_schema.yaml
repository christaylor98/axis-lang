nodes:
  Program:
    fields:
      decls: [Decl]

  Decl:
    union:
      - Function
      - EnumDecl

  Function:
    fields:
      name: Ident
      params: [Param]
      return_type: Type
      body: Block

  Param:
    fields:
      name: Ident
      type: Type

  Block:
    fields:
      statements: [LetStmt]
      result: Expr

  LetStmt:
    fields:
      name: Ident
      value: Expr

  Expr:
    union:
      - IfExpr
      - MatchExpr
      - CallExpr
      - LambdaExpr
      - TupleExpr
      - ProjExpr
      - Literal
      - IdentRef
      - Block

  ProjExpr:
    fields:
      expr: Expr
      index: int

  TupleExpr:
    fields:
      items: [Expr]
