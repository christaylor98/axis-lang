# H1 Normalization Rules
# Surface: surface-h1 (human-friendly syntax)
# Target NF Version: 0.1
# Description: Desugar H1 high-level constructs to NF

version: "0.1"
target_nf_version: "0.1"
description: "Normalization rules for H1 human surface - extensive desugaring required"

# H1 has many high-level constructs that must be desugared:
# - Program/Item/FnDecl → flatten to expression
# - Block → nested LetExpr
# - LetStmt → LetExpr
# - MatchExpr → nested IfExpr
# - ForExpr → loop desugaring (registry call or recursive lambda)
# - WhileExpr → loop desugaring
# - Multiple statements → nested bindings

strategy:
  application_order: "sequential"
  traversal_order: "bottom_up"
  default_behavior: "fail_loud"  # H1 requires explicit rules
  failure_mode: "fail_loud"

rule_order:
  # First: desugar high-level program structure
  - "desugar_program"
  - "desugar_item"
  - "desugar_fn_decl"
  
  # Second: desugar blocks and statements
  - "desugar_block"
  - "desugar_block_content"
  - "desugar_stmt"
  - "desugar_assign_stmt"
  - "desugar_expr_stmt"
  
  # Third: desugar control flow
  - "desugar_if_expr"
  - "desugar_match_expr"
  - "desugar_for_expr"
  - "desugar_while_expr"
  - "desugar_loop_expr"
  
  # Fourth: handle expression variants and expression hierarchy wrappers
  - "unwrap_expr_variant"
  - "unwrap_equality_expr"
  - "unwrap_rel_expr"
  - "unwrap_add_expr"
  - "unwrap_mul_expr"
  - "unwrap_unary_expr"
  - "unwrap_call_expr"
  - "unwrap_primary"
  - "normalize_primary_ident"

  # Fifth: pass-through structural nodes that are discarded by parent rules
  - "normalize_empty"
  - "normalize_param_list"
  - "normalize_param_rest"
  - "normalize_param"
  - "normalize_arg_list"
  - "normalize_arg_list_rest"
  - "normalize_call_suffix"

  # Sixth: identity rules for NF-compliant nodes
  - "identity_typed_literals"
  - "identity_constructors"
  - "identity_variables"
  - "identity_let_expr"
  - "identity_lam_expr"
  - "identity_app_expr"
  - "identity_call_expr"

rules:
  # ═══════════════════════════════════════════════════════════════════════
  # PROGRAM STRUCTURE DESUGARING
  # ═══════════════════════════════════════════════════════════════════════
  
  desugar_program:
    description: "Unwrap Program to single-item content (multi-item not supported)"
    pattern:
      node_kind: "Program"
      fields:
        items: { exists: true, is_list: true }
    replacement:
      nf_node: "unwrap_program_items"
      nf_fields: "extract_single_item"
    constraints:
      - "exactly one item must exist (multi-item programs not supported in NF 0.1)"
    notes:
      - "Program wrapper is not NF - must be eliminated during normalization"
      - "Multi-item programs require module system (deferred to future NF version)"

  desugar_item:
    description: "Unwrap Item variant to access inner declaration"
    pattern:
      node_kind: "Item"
      fields:
        variant: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        variant: { from: "node:variant", recurse: true }
    constraints: []

  desugar_fn_decl:
    description: "Unwrap FnDecl to its body expression (function structure dropped at IR level)"
    pattern:
      node_kind: "FnDecl"
      fields:
        body: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        body: { from: "node:body", recurse: true }
    constraints: []
    notes:
      - "FnDecl is transparent at Core IR level — only the body expression is lowered"

  # ═══════════════════════════════════════════════════════════════════════
  # BLOCK AND STATEMENT DESUGARING
  # ═══════════════════════════════════════════════════════════════════════

  desugar_block:
    description: "Desugar Block to BlockContent"
    pattern:
      node_kind: "Block"
      fields:
        content: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        content: { from: "node:content", recurse: true }
    constraints: []

  desugar_block_content:
    description: "Fold BlockContent items (AssignStmt chain + final Expr) into nested LetExpr"
    pattern:
      node_kind: "BlockContent"
      fields:
        items: { exists: true, is_list: true }
    replacement:
      nf_node: "fold_stmts_to_let_chain"
      nf_fields: {}
    constraints:
      - "last item must be an expression (not an AssignStmt)"
      - "preceding items must be AssignStmt (desugared to LetBinding by the time this rule fires)"
    notes:
      - "Bottom-up: children are normalized before BlockContent. AssignStmts become LetBindings first."
      - "Strategy folds right-to-left: LetExpr(n1,v1, LetExpr(n2,v2, ... body))"
      - "Single-expression block (0 assignments): returns the expression directly"

  desugar_stmt:
    description: "Unwrap Stmt variant to access inner statement"
    pattern:
      node_kind: "Stmt"
      fields:
        variant: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        variant: { from: "node:variant", recurse: true }
    constraints: []

  desugar_assign_stmt:
    description: "Convert AssignStmt to LetBinding intermediate node (body supplied by BlockContent fold)"
    pattern:
      node_kind: "AssignStmt"
      fields:
        name: { exists: true, is_token: true }
        value: { exists: true, is_node: true }
    replacement:
      nf_node: "LetBinding"
      nf_fields:
        name: { from: "token:name" }
        value: { from: "node:value", recurse: true }
    constraints:
      - "value must normalize"
    notes:
      - "LetBinding is an intermediate NF node consumed by fold_stmts_to_let_chain"
      - "The fold in desugar_block_content chains LetBindings into nested LetExprs"

  desugar_expr_stmt:
    description: "Unwrap ExprStmt to access expression"
    pattern:
      node_kind: "ExprStmt"
      fields:
        expr: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        expr: { from: "node:expr", recurse: true }
    constraints: []

  # ═══════════════════════════════════════════════════════════════════════
  # CONTROL FLOW DESUGARING
  # ═══════════════════════════════════════════════════════════════════════

  desugar_if_expr:
    description: "Desugar H1 IfExpr to NF IfExpr (blocks → expressions)"
    pattern:
      node_kind: "IfExpr"
      fields:
        condition: { exists: true, is_node: true }
        then_block: { exists: true, is_node: true }
        else_block: { exists: true, is_node: true }
    replacement:
      nf_node: "IfExpr"
      nf_fields:
        condition: { from: "node:condition", recurse: true }
        then_branch: { from: "node:then_block", recurse: true }
        else_branch: { from: "node:else_block", recurse: true }
    constraints:
      - "all branches must normalize"
      - "blocks desugar to expressions via block rules"

  desugar_match_expr:
    description: "Desugar MatchExpr to nested IfExpr"
    pattern:
      node_kind: "MatchExpr"
      fields:
        scrutinee: { exists: true, is_node: true }
        arms: { exists: true, is_list: true }
    replacement:
      nf_node: "nested_if_from_arms"
      nf_fields:
        scrutinee: { from: "node:scrutinee", recurse: true }
        arms: { from: "nodes:arms" }
      strategy: "build_nested_if_tree"
    constraints:
      - "at least one arm must exist"
    notes:
      - "match x { p1 => e1, p2 => e2 } → if (test p1 x) then e1 else (if (test p2 x) then e2 ...)"
      - "Pattern matching requires runtime support or compile-time expansion"

  desugar_for_expr:
    description: "Desugar ForExpr to recursive lambda or registry call (complex synthesis)"
    pattern:
      node_kind: "ForExpr"
      fields:
        var: { exists: true, is_token: true }
        iter: { exists: true, is_node: true }
        body: { exists: true, is_node: true }
    replacement:
      nf_node: "CallExpr"
      nf_fields: "synthesize_for_each_call"
      strategy: "use_registry_for_each"
    constraints:
      - "iter must normalize"
      - "body must normalize"
    notes:
      - "for x in iter { body } → call(for_each, iter, lam(x, body))"
      - "Requires for_each in registry"
      - "Complex synthesis creates: CallExpr(for_each, [iter, LamExpr(var, body)])"

  desugar_while_expr:
    description: "Desugar WhileExpr to recursive lambda"
    pattern:
      node_kind: "WhileExpr"
      fields:
        condition: { exists: true, is_node: true }
        body: { exists: true, is_node: true }
    replacement:
      nf_node: "recursive_lambda"
      nf_fields:
        condition: { from: "node:condition", recurse: true }
        body: { from: "node:body", recurse: true }
      strategy: "build_recursive_while_loop"
    constraints:
      - "condition and body must normalize"
    notes:
      - "while cond { body } → (lam loop () if cond { body; loop() } else ())()"
      - "Requires self-application or registry support"

  desugar_loop_expr:
    description: "Desugar infinite LoopExpr"
    pattern:
      node_kind: "LoopExpr"
      fields:
        body: { exists: true, is_node: true }
    replacement:
      nf_node: "infinite_recursive_lambda"
      nf_fields:
        body: { from: "node:body", recurse: true }
      strategy: "build_infinite_loop"
    constraints:
      - "body must normalize"
    notes:
      - "loop { body } → (lam loop () { body; loop() })()"
      - "Requires recursion support"

  # ═══════════════════════════════════════════════════════════════════════
  # EXPRESSION UNWRAPPING
  # ═══════════════════════════════════════════════════════════════════════

  unwrap_expr_variant:
    description: "Unwrap Expr variant wrapper"
    pattern:
      node_kind: "Expr"
      fields:
        variant: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        variant: { from: "node:variant", recurse: true }
    constraints: []

  # ─── Binary expression wrappers (transparent when no ops) ───────────────

  unwrap_equality_expr:
    description: "Unwrap EqualityExpr to its left operand (no ops case)"
    pattern:
      node_kind: "EqualityExpr"
      fields:
        left: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        left: { from: "node:left", recurse: true }
    constraints: []

  unwrap_rel_expr:
    description: "Unwrap RelExpr to its left operand (no ops case)"
    pattern:
      node_kind: "RelExpr"
      fields:
        left: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        left: { from: "node:left", recurse: true }
    constraints: []

  unwrap_add_expr:
    description: "Unwrap AddExpr to its left operand (no ops case)"
    pattern:
      node_kind: "AddExpr"
      fields:
        left: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        left: { from: "node:left", recurse: true }
    constraints: []

  unwrap_mul_expr:
    description: "Unwrap MulExpr to its left operand (no ops case)"
    pattern:
      node_kind: "MulExpr"
      fields:
        left: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        left: { from: "node:left", recurse: true }
    constraints: []

  unwrap_unary_expr:
    description: "Unwrap UnaryExpr variant wrapper"
    pattern:
      node_kind: "UnaryExpr"
      fields:
        variant: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        variant: { from: "node:variant", recurse: true }
    constraints: []

  unwrap_call_expr:
    description: "Unwrap CallExpr to target (no suffixes case)"
    pattern:
      node_kind: "CallExpr"
      fields:
        target: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        target: { from: "node:target", recurse: true }
    constraints: []

  unwrap_primary:
    description: "Unwrap Primary variant wrapper (when variant is a node)"
    pattern:
      node_kind: "Primary"
      fields:
        variant: { exists: true, is_node: true }
    replacement:
      nf_node: "transparent"
      nf_fields:
        variant: { from: "node:variant", recurse: true }
    constraints: []

  normalize_primary_ident:
    description: "Convert Primary(IDENT token) to VarRef"
    pattern:
      node_kind: "Primary"
      fields:
        variant: { exists: true, is_token: true }
    replacement:
      nf_node: "VarRef"
      nf_fields:
        name: { from: "token:variant" }
    constraints: []
    notes:
      - "When Primary wraps a bare identifier, produce VarRef for lowering"

  # ═══════════════════════════════════════════════════════════════════════
  # EMPTY / NULL PASS-THROUGH
  # ═══════════════════════════════════════════════════════════════════════

  normalize_empty:
    description: "Pass through Empty node (empty param list, etc.) as identity"
    pattern:
      node_kind: "Empty"
      fields: {}
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []
    notes:
      - "Empty arises from empty ParamList in fn main() — treated as no-op"

  normalize_param_list:
    description: "Pass through ParamList — discarded by transparent FnDecl rule"
    pattern:
      node_kind: "ParamList"
      fields:
        params: { exists: true, is_list: true }
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []

  normalize_param_rest:
    description: "Pass through ParamRest — discarded by parent rules"
    pattern:
      node_kind: "ParamRest"
      fields:
        param: { exists: true, is_node: true }
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []

  normalize_param:
    description: "Pass through Param — discarded by parent rules"
    pattern:
      node_kind: "Param"
      fields:
        name: { exists: true, is_token: true }
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []

  normalize_arg_list:
    description: "Pass through ArgList — discarded by parent call rules"
    pattern:
      node_kind: "ArgList"
      fields:
        args: { exists: true, is_list: true }
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []

  normalize_arg_list_rest:
    description: "Pass through ArgListRest"
    pattern:
      node_kind: "ArgListRest"
      fields:
        arg: { exists: true, is_node: true }
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []

  normalize_call_suffix:
    description: "Pass through CallSuffix"
    pattern:
      node_kind: "CallSuffix"
      fields:
        args: { exists: true, is_node: true }
    replacement:
      nf_node: "identity"
      nf_fields: {}
    constraints: []

  # ═══════════════════════════════════════════════════════════════════════
  # IDENTITY RULES (NF-compliant nodes)
  # ═══════════════════════════════════════════════════════════════════════

  identity_typed_literals:
    description: "Pass through typed literal constructor nodes"
    pattern:
      node_kind_matches:
        - "IntLit"
        - "FloatLit"
        - "DecimalLit"
        - "TextLit"
        - "BoolLit"
        - "UnitLit"
    replacement:
      nf_node: "identity"
      nf_fields: "preserve_all"
    constraints: []

  identity_constructors:
    description: "Pass through Value/List constructor nodes"
    pattern:
      node_kind_matches:
        - "ValueConstructExpr"
        - "ListConstructExpr"
    replacement:
      nf_node: "identity"
      nf_fields: "preserve_all"
    constraints: []

  identity_variables:
    description: "Pass through variable references"
    pattern:
      node_kind_matches:
        - "VarRef"
        - "VarExpr"
        - "IdentExpr"
    replacement:
      nf_node: "VarRef"
      nf_fields: "preserve_all"
    constraints: []

  identity_let_expr:
    description: "Pass through LetExpr (if already in NF form)"
    pattern:
      node_kind: "LetExpr"
      fields:
        name: { exists: true, is_token: true }
        value: { exists: true, is_node: true }
        body: { exists: true, is_node: true }
    replacement:
      nf_node: "identity"
      nf_fields:
        name: { from: "token:name" }
        value: { from: "node:value", recurse: true }
        body: { from: "node:body", recurse: true }
    constraints: []

  identity_lam_expr:
    description: "Pass through LamExpr"
    pattern:
      node_kind: "LamExpr"
      fields:
        param: { exists: true, is_token: true }
        body: { exists: true, is_node: true }
    replacement:
      nf_node: "identity"
      nf_fields:
        param: { from: "token:param" }
        body: { from: "node:body", recurse: true }
    constraints: []

  identity_app_expr:
    description: "Pass through AppExpr"
    pattern:
      node_kind: "AppExpr"
      fields:
        fn: { exists: true, is_node: true }
        arg: { exists: true, is_node: true }
    replacement:
      nf_node: "identity"
      nf_fields:
        fn: { from: "node:fn", recurse: true }
        arg: { from: "node:arg", recurse: true }
    constraints: []

  identity_call_expr:
    description: "Pass through CallExpr"
    pattern:
      node_kind: "CallExpr"
      fields:
        name: { exists: true, is_token: true }
        args: { exists: true, is_list: true }
    replacement:
      nf_node: "identity"
      nf_fields:
        name: { from: "token:name" }
        args: { from: "nodes:args", recurse: true }
    constraints: []

# Fresh name generation
fresh_name_strategy:
  prefix: "_h1_tmp"
  uniqueness: "position_based"
  format: "{prefix}_{position}"
  collision_handling: "fail_loud"

# Error handling
error_conditions:
  - condition: "Unsupported H1 construct (controllers, events, etc.)"
    action: "fail_with_unsupported_feature_error"
  - condition: "Unknown node kind"
    action: "fail_with_unknown_node_error"
  - condition: "Missing required field"
    action: "fail_with_missing_field_error"
  - condition: "Child normalization fails"
    action: "propagate_child_error"

# Post-normalization validation
post_normalization:
  validation_required: true
  validation_spec: "NORMAL_FORM_SPEC_0.1.yaml"
  failure_mode: "block_lowering"

# Unsupported features (TODO for future NF versions)
unsupported_features:
  - "ControllerDecl"
  - "EventSig"
  - "RunStmt"
  - "SpawnExpr"
  - "JoinExpr"
  - "ChannelExpr"
  - "Terminator (break/continue/return)"

notes:
  - "H1 requires extensive desugaring"
  - "Multi-parameter functions → curried lambdas"
  - "Blocks → nested LetExpr"
  - "Match → nested IfExpr (simplified pattern matching)"
  - "Loops → recursive lambdas or registry calls"
  - "Controllers/events not yet supported in NF 0.1"
