[package]
name = "axis_lang"
version = "0.1.0"
edition = "2021"
authors = ["Chris Taylor"]
description = "The Axis language: a deterministic, spec-driven compiler pipeline from Axis source to canonical Core IR."

[[bin]]
name = "axis"
path = "src/main.rs"

[features]
# Legacy lexer from Phase 1 - DO NOT USE in new code
# This feature exists only for backward compatibility and will be removed
legacy-lexer = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
sha2 = "0.10"
chrono = "0.4"
getrandom = "0.2"

# axis_mcp (src/bin/axis_mcp.rs): read-only MCP shell over the axis binary.
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std"] }


[dev-dependencies]
tempfile = "3.0"
