# M1 (Mechanical 1) Lexer Specification
# Surface: surface-m1
# Version: 0.1
#
# Design goals (AXLANG_TYPE_SYSTEM_V2):
# - AI-first mechanical generation surface
# - Explicit, deterministic tokenization
# - No ambiguity, no inference
# - Fail-fast on invalid input
#
# Governed by: AXLANG_TYPE_SYSTEM_V2
# Invariants: REGISTRY_SINGLE_CONCRETE_CALLABLE, VALUELIST_TAG_MANDATORY

lexer:
  charset: ascii
  case_sensitive: true

  whitespace:
    pattern: "[ \\t\\n\\r]+"
    skip: true

  comments:
    - pattern: "//[^\\n]*"
      skip: true

  # Keywords — must be matched before identifiers
  # Value and ValueList are keywords because they are type constructors,
  # not user-definable names. All others are control-flow/binding forms.
  keywords:
    - fn
    - let
    - in
    - if
    - else
    - true
    - false
    - Int
    - Text
    - Bool
    - Unit
    - Bytes
    - Value
    - ValueList
    - determine

  identifiers:
    pattern: "[a-zA-Z_][a-zA-Z0-9_]*"
    forbid:
      - Int        # reserved — primitive type constructor
      - Text       # reserved — primitive type constructor
      - Bool       # reserved — primitive type constructor
      - Unit       # reserved — primitive type constructor
      - Bytes      # reserved — primitive type constructor (atomic blob, PrimCode::Bytes)
      - Value      # reserved — compound type constructor keyword
      - ValueList  # reserved — list constructor keyword

  literals:
    int:
      pattern: "[0-9]+"
      base: 10
    string:
      delimiter: "\""
      escapes: ["\\\"", "\\\\", "\\n", "\\t"]
      forbid_newlines: true

  punctuation:
    - "("
    - ")"
    - "{"
    - "}"
    - "["
    - "]"
    - ","
    - ":"
    - "->"
    - "="
